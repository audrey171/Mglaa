<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mglaa — color instrument</title><link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=1"><link rel="stylesheet" href="style.css?v=about-3"></head><body>
<select id="weave-select" aria-label="Weaving pattern"><option value="flanders">Flower of Flanders</option><option value="pond">Pond Lily</option><option value="dimes">Dimes and Dollars</option><option value="chariot">Chariot Wheel No. 2</option><option value="custom">Custom</option></select><div id="draft-viewport"><canvas tabindex="0" id="weave-draft" aria-label="Four-harness threading draft for the selected pattern"></canvas></div>
<div id="voice-grid" role="group" aria-label="Instruments: sixteen melody sounds on the left and sixteen pad sounds on the right"></div><div id="toolbar"><div id="pattern-palette" role="group" aria-label="Pattern and background colors control the music"></div><button id="play" class="pixel-button" aria-label="Start music" aria-pressed="false"><span class="play-label">play</span></button></div><canvas id="score" tabindex="0" aria-label="Scrolling textile of the music. New rows enter at the top; older patterns remain in the rows below. Space starts or pauses."></canvas>
<a id="info" href="about.html">about</a><output id="status" class="sr-only" aria-live="polite"></output>
<dialog id="palette-dialog" aria-label="Choose a color"><div class="picker-tools"><input id="picker" type="color" aria-label="Choose an exact color"><button id="palette-close" class="pixel-button" aria-label="Close color palette"></button></div><canvas id="color-field" tabindex="0" role="application" aria-label="Color grid. Left and right change hue; up and down change lightness."></canvas><canvas id="saturation" tabindex="0" role="slider" aria-label="Saturation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></canvas></dialog>

<script type="module" src="color-app.js?v=about-3"></script></body></html>
